<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Hunter</title>
    <!-- Tema ANTES de la hoja de estilos: evita el flash de tema incorrecto. -->
    <script src="/uiPrefs.js"></script>
    <script>window.UiPrefs && window.UiPrefs.applyStoredTheme();</script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Job Hunter</span>
      </div>

      <div class="topbar-spacer"></div>

      <label class="field-inline" for="sortSelect">
        <span class="field-inline-label">Orden</span>
        <select id="sortSelect">
          <option value="overall">Recomendadas / General</option>
          <option value="newest">Más nuevas</option>
          <option value="oldest">Más viejas</option>
          <option value="title">Título</option>
          <option value="company">Empresa</option>
        </select>
      </label>

      <div class="topbar-divider" aria-hidden="true"></div>

      <div class="mariano-linkedin">
        <a class="ml-link" href="https://www.linkedin.com/in/mdiazvillodas/" target="_blank" rel="noopener">LinkedIn de Mariano ↗</a>
        <button id="copyLinkedinBtn" class="btn ghost small" type="button">Copiar enlace</button>
      </div>

      <button id="diagBtn" class="btn ghost small" type="button">Diagnóstico</button>

      <button id="themeToggle" class="btn icon ghost" type="button" title="Cambiar tema" aria-label="Cambiar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M12 2.4v2.4M12 19.2v2.4M2.4 12h2.4M19.2 12h2.4M5.2 5.2l1.7 1.7M17.1 17.1l1.7 1.7M18.8 5.2l-1.7 1.7M6.9 17.1l-1.7 1.7"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
      </button>
    </header>

    <main class="layout" id="mainLayout">
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-toolbar">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
              <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.8" />
              <path d="M15.8 15.8L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <input id="globalSearch" class="global-search" type="search" placeholder="Buscar título, empresa, ubicación…" aria-label="Buscar ofertas" />
          </div>
          <button id="filtersBtn" class="btn filters-btn" type="button" aria-expanded="false" aria-controls="filterDrawer">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <path d="M3.5 6h17M6.5 12h11M10 18h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            </svg>
            <span>Filtros</span>
            <span id="filterCount" class="filter-count" hidden>0</span>
          </button>
        </div>

        <div class="status-tabs-wrap">
          <nav class="status-tabs" id="statusFilter" aria-label="Vistas por estado"></nav>
        </div>

        <div class="list-meta">
          <span class="list-count"><b id="listCount">0</b> ofertas</span>
          <div class="active-chips" id="activeChips"></div>
        </div>

        <ul class="job-list" id="jobList"></ul>

        <!-- FILTER DRAWER: se superpone a la lista, no la empuja -->
        <div class="filter-drawer" id="filterDrawer" hidden role="group" aria-label="Filtros avanzados">
          <div class="drawer-grid">
            <label class="field">Plataforma
              <select id="sourceFilter">
                <option value="all">Todas</option>
                <option value="linkedin">LinkedIn</option>
                <option value="infojobs">InfoJobs</option>
              </select>
            </label>
            <label class="field">Decisión IA
              <select id="aiDecisionFilter">
                <option value="all">Todas</option>
                <option value="YES">SÍ</option>
                <option value="MAYBE">QUIZÁS</option>
                <option value="NO">NO</option>
              </select>
            </label>
            <label class="field">Easy Apply
              <select id="easyApplyFilter">
                <option value="all">Todas</option>
                <option value="yes">Easy Apply</option>
                <option value="no">Sin Easy Apply</option>
              </select>
            </label>
            <label class="field">Puntaje
              <select id="scoreFilter">
                <option value="0">Todos</option>
                <option value="65">65+</option>
                <option value="70">70+</option>
                <option value="75">75+</option>
                <option value="80">80+</option>
                <option value="90">90+</option>
              </select>
            </label>
            <label class="field">Búsqueda
              <select id="queryFilter"><option value="">Todas las búsquedas</option></select>
            </label>
            <label class="field span-2">Empresa
              <input id="companyFilter" type="search" placeholder="Filtrar por empresa…" />
            </label>
          </div>

          <div class="field span-2">
            <span class="field-label">Familias de rol</span>
            <div id="familyFilter" class="chips"></div>
          </div>

          <div class="drawer-actions">
            <button class="btn ghost small" id="clearFiltersBtn" type="button" hidden>Limpiar filtros</button>
            <button class="btn small" id="closeFiltersBtn" type="button">Listo</button>
          </div>
        </div>
      </aside>

      <!-- DETAIL -->
      <section class="detail" id="detail">
        <button class="btn small detail-back" id="detailBack" type="button">← Volver</button>
        <div class="empty" id="detailEmpty">
          <p>Seleccioná una oferta para ver el detalle.</p>
        </div>
        <article class="detail-content" id="detailContent" hidden></article>
      </section>
    </main>

    <!-- DISCARD MODAL -->
    <div class="modal-backdrop" id="discardModal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="discardTitle">
        <h3 id="discardTitle">¿Por qué descartás esta oferta?</h3>
        <div id="discardReasons" class="reason-grid"></div>
        <label class="comment-label">Comentario opcional
          <textarea id="discardComment" rows="3" placeholder="Motivo libre…"></textarea>
        </label>
        <div class="modal-actions">
          <button class="btn ghost" id="discardCancel" type="button">Cancelar</button>
          <button class="btn danger" id="discardConfirm" type="button">Descartar oferta</button>
        </div>
      </div>
    </div>

    <!-- DIAGNOSTICS PANEL -->
    <div class="modal-backdrop" id="diagPanel" hidden>
      <div class="modal wide" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h3>Diagnóstico</h3>
          <button class="btn ghost small" id="diagClose" type="button">Cerrar</button>
        </div>
        <div class="diag-cols">
          <div>
            <h4>Preferencias aprendidas</h4>
            <div id="learnedPrefs" class="diag-body"></div>
          </div>
          <div>
            <h4>Calibración IA vs usuario</h4>
            <div id="calibration" class="diag-body"></div>
          </div>
        </div>
        <p class="muted small">Solo lectura. No modifica preferencias, scoring ni IA.</p>
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <script src="/jobListLogic.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
